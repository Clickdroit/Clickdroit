name: Update Animated Contribution Graph

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Animated Contribution Calendar
        run: python scripts/generate_contributions.py

      - name: Commit Updated Contribution SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update animated contribution graph"
          file_pattern: "assets/contributions.svg"
